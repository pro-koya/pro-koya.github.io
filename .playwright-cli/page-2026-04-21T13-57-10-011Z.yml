                    - img [ref=f1e395]
                  - generic [ref=f1e397]: 基本機能は、アカウント登録なしでご利用いただけます。端末内にデータが保存されます。家族と記録を共有したい場合、もしくは端末間で同期したい場合のみ、無料のアカウントを作成してください。
