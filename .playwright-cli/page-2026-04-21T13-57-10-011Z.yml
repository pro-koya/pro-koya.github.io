                  - generic [ref=f1e389]: 大丈夫です。とれたべは、むしろベランダやプランターのような小さな家庭菜園に合わせて設計されています。「ふんわり1袋」「にぎり1つ」など、ざっくりした単位で記録できるので、大量収穫ではない家庭菜園のリズムに、自然にフィットします。
