                  - generic [ref=f1e437]: 家庭菜園では、キッチンスケールで毎回量るのは少し面倒です。「ふんわり1袋（スーパーでよく売っている小袋サイズ）」や「にぎり1つ」など、感覚的な量りでも十分記録できるよう、柔らかな単位を用意しています。
