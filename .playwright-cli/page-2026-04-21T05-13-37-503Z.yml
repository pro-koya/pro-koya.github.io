                  - generic [ref=f1e384]: はい、むしろ初心者の方にこそ使っていただきたいアプリです。品種ごとの収穫目安や、保存方法のミニ知識など、育て始めたばかりの方が迷いやすいポイントを、そっとサポートします。難しい専門用語や、細かな管理は求めません。
