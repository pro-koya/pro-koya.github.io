                    - img [ref=f1e406]
                  - generic [ref=f1e408]: 基本機能は無料でお使いいただけます。献立提案の無制限利用、年間グラフのエクスポート、家族共有などの追加機能は、買い切り900円（プレミアム）でご利用いただけます。サブスクリプションではありません。
