                    - img [ref=f1e390]
                  - generic [ref=f1e392]: 大丈夫です。とれたべは、むしろベランダやプランターのような小さな家庭菜園に合わせて設計されています。「ふんわり1袋」「にぎり1つ」など、ざっくりした単位で記録できるので、大量収穫ではない家庭菜園のリズムに、自然にフィットします。
                - generic [ref=f1e394]:
                  - button "アカウント登録は必要ですか？" [ref=f1e395] [cursor=pointer]:
                    - generic [ref=f1e396]: アカウント登録は必要ですか？
                    - img [ref=f1e398]
                  - generic [ref=f1e400]: 基本機能は、アカウント登録なしでご利用いただけます。端末内にデータが保存されます。家族と記録を共有したい場合、もしくは端末間で同期したい場合のみ、無料のアカウントを作成してください。
                - generic [ref=f1e402]:
                  - button "料金はかかりますか？" [ref=f1e403] [cursor=pointer]:
