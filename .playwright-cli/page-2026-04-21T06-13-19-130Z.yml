          - paragraph [ref=e122]: 本アプリでは、Google AdMobなどの広告配信サービスを利用する場合があります。 広告配信事業者は、広告表示、効果測定、不正利用防止などの目的で、端末情報、広告識別子、利用状況に関する情報を取得する場合があります。 端末の設定により、広告トラッキングに関する選択を変更できる場合があります。
