        - paragraph [ref=e24]: 本アプリは、家庭菜園で育てている野菜、収穫記録、収穫物の保存状況、料理記録、献立提案、次に育てる野菜の提案、チーム共有や投稿などを補助するためのサービスです。 本アプリが提供する情報は、家庭菜園や日々の食事づくりを支援する一般的な参考情報であり、農業、栄養、医療、法律その他の専門的助言を提供するものではありません。
