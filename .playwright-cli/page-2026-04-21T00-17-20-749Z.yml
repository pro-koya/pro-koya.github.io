        - generic [ref=e51]:
          - heading "差別化の芯は、収穫後の意思決定を軽くすることでした。" [level=2] [ref=e52]
          - paragraph [ref=e53]: Harvest-Loop のコードベースを確認すると、ホーム、収穫物一覧、献立提案、料理実績、 次に育てる野菜の提案までが一つのループとしてつながっています。LPでもその構造を崩さず、 「栽培記録アプリ」ではなく「収穫後アプリ」として理解できる順番に情報を整理しました。
          - list [ref=e54]:
            - listitem [ref=e55]: 栽培の見通しから収穫導線までをホームで俯瞰できる
            - listitem [ref=e56]: 収穫記録がそのまま在庫化され、献立提案へつながる
            - listitem [ref=e57]: 料理実績が、次に育てる野菜の提案にも再利用される
