<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option A v2 — Athlete Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="option-a/styles.v2.css">
<style>
  body { margin: 0; background: #14130f; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="option-a/pages.v2.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="opa-pc" title="Option A v2 — Athlete Editorial · PC" subtitle="黒×強いタイポ × グリッド。スポーツブランドとエディトリアルの中間。スクロールでパララックスとリビールが効きます。">
        <DCArtboard id="a2-home-pc"    label="Home · PC · 1280×2700"    width={1280} height={2700}><A2Home sp={false} /></DCArtboard>
        <DCArtboard id="a2-about-pc"   label="About · PC · 1280×2400"   width={1280} height={2400}><A2About sp={false} /></DCArtboard>
        <DCArtboard id="a2-works-pc"   label="Works · PC · 1280×2300"   width={1280} height={2300}><A2Works sp={false} /></DCArtboard>
        <DCArtboard id="a2-journal-pc" label="Journal · PC · 1280×2100" width={1280} height={2100}><A2Journal sp={false} /></DCArtboard>
        <DCArtboard id="a2-contact-pc" label="Contact · PC · 1280×2100" width={1280} height={2100}><A2Contact sp={false} /></DCArtboard>
      </DCSection>

      <DCSection id="opa-sp" title="Option A v2 — Athlete Editorial · SP" subtitle="モバイル。同じトーン、密度を再構成。">
        <DCArtboard id="a2-home-sp"    label="Home · SP · 390×2000"    width={390} height={2000}><A2Home sp={true} /></DCArtboard>
        <DCArtboard id="a2-about-sp"   label="About · SP · 390×1900"   width={390} height={1900}><A2About sp={true} /></DCArtboard>
        <DCArtboard id="a2-works-sp"   label="Works · SP · 390×1900"   width={390} height={1900}><A2Works sp={true} /></DCArtboard>
        <DCArtboard id="a2-journal-sp" label="Journal · SP · 390×1700" width={390} height={1700}><A2Journal sp={true} /></DCArtboard>
        <DCArtboard id="a2-contact-sp" label="Contact · SP · 390×1800" width={390} height={1800}><A2Contact sp={true} /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
