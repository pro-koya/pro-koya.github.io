<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Liftly - 認証中</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fafafa; }
    .msg { text-align: center; color: #333; }
    .err { color: #b91c1c; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="msg">
    <p id="status">アプリを開いています...</p>
    <p id="err" class="err" hidden></p>
  </div>
  <script>
    (function() {
      // Supabase がリダイレクトした際の query と fragment をそのままアプリのスキームへ渡す
      var scheme = 'com.fitnesslog.liftly';
      var host = 'auth';
      var path = '/callback';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var appUrl = scheme + '://' + host + path + search + hash;

      if (!search && !hash) {
        document.getElementById('status').textContent = '認証コールバック用のパラメータがありません。';
        return;
      }
      try {
        window.location.replace(appUrl);
      } catch (e) {
        document.getElementById('status').textContent = 'アプリを開けませんでした。';
        document.getElementById('err').textContent = e.message || '';
        document.getElementById('err').hidden = false;
      }
    })();
  </script>
</body>
</html>
