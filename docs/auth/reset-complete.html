<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Liftly - パスワードリセット完了。アプリに戻ってログインしてください。">
  <meta name="theme-color" content="#ffffff">
  <title>Liftly - パスワードリセット</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Liftly</a>
      <span class="nav-lang">
        <a href="?lang=ja" class="nav-lang-link" data-lang-link="ja" data-i18n="lang.ja">日本語</a>
        <span class="nav-lang-sep" aria-hidden="true">|</span>
        <a href="?lang=en" class="nav-lang-link" data-lang-link="en" data-i18n="lang.en">English</a>
      </span>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="メニューを開く">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="nav-right" id="nav-menu">
        <div class="nav-links">
          <a href="../index.html#features" data-i18n="nav.features">機能</a>
          <a href="../index.html#howto" data-i18n="nav.howto">使い方</a>
          <a href="../index.html#privacy" data-i18n="nav.privacy">プライバシー</a>
          <a href="../index.html#contact" data-i18n="nav.contact">お問い合わせ</a>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <section class="auth-reset-section">
      <div class="container">
        <div class="auth-reset-card">
          <div class="auth-reset-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <h1 class="auth-reset-title" data-i18n="reset.title">パスワードリセット</h1>
          <p class="auth-reset-lead" data-i18n="reset.lead">メールのリンクからこのページにアクセスしました。</p>
          <p class="auth-reset-desc" data-i18n="reset.desc">新しいパスワードの設定が完了したら、Liftly アプリを開き、設定 → 同期 からログインしてください。このページは閉じてかまいません。</p>
          <a href="../index.html" class="btn-primary auth-reset-btn" data-i18n="reset.back">トップページへ戻る</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner container">
      <div class="footer-links">
        <a href="../index.html#features" data-i18n="footer.features">機能</a>
        <a href="../index.html#howto" data-i18n="footer.howto">使い方</a>
        <a href="../index.html#privacy" data-i18n="footer.privacy">プライバシー</a>
        <a href="../index.html#contact" data-i18n="footer.contact">お問い合わせ</a>
      </div>
      <span class="footer-copy" data-i18n="footer.copyright">© Liftly - Simple Fitness Log</span>
    </div>
  </footer>

  <script>
    (function() {
      var translations = {
        ja: {
          'meta.title': 'Liftly - パスワードリセット',
          'meta.description': 'Liftly - パスワードリセット完了。アプリに戻ってログインしてください。',
          'reset.title': 'パスワードリセット',
          'reset.lead': 'メールのリンクからこのページにアクセスしました。',
          'reset.desc': '新しいパスワードの設定が完了したら、Liftly アプリを開き、設定 → 同期 からログインしてください。このページは閉じてかまいません。',
          'reset.back': 'トップページへ戻る',
          'nav.features': '機能',
          'nav.howto': '使い方',
          'nav.privacy': 'プライバシー',
          'nav.contact': 'お問い合わせ',
          'footer.features': '機能',
          'footer.howto': '使い方',
          'footer.privacy': 'プライバシー',
          'footer.contact': 'お問い合わせ',
          'footer.copyright': '© Liftly - Simple Fitness Log',
          'lang.ja': '日本語',
          'lang.en': 'English'
        },
        en: {
          'meta.title': 'Liftly - Password Reset',
          'meta.description': 'Liftly - Password reset. Return to the app to sign in.',
          'reset.title': 'Password Reset',
          'reset.lead': 'You opened this page from the link in your email.',
          'reset.desc': 'After setting your new password, open the Liftly app and sign in from Settings → Sync. You can close this page.',
          'reset.back': 'Back to top',
          'nav.features': 'Features',
          'nav.howto': 'How to',
          'nav.privacy': 'Privacy',
          'nav.contact': 'Contact',
          'footer.features': 'Features',
          'footer.howto': 'How to',
          'footer.privacy': 'Privacy',
          'footer.contact': 'Contact',
          'footer.copyright': '© Liftly - Simple Fitness Log',
          'lang.ja': '日本語',
          'lang.en': 'English'
        }
      };
      var supportedLangs = ['ja', 'en'];
      var defaultLang = 'ja';
      function getLang() {
        var p = new URLSearchParams(window.location.search);
        var lang = (p.get('lang') || '').toLowerCase();
        return supportedLangs.indexOf(lang) >= 0 ? lang : defaultLang;
      }
      function getLangUrl(lang) {
        var u = new URL(window.location.href);
        u.searchParams.set('lang', lang);
        return u.pathname + u.search;
      }
      function apply(lang) {
        var t = translations[lang];
        document.documentElement.lang = lang;
        document.title = t['meta.title'];
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', t['meta.description']);
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
          var key = el.getAttribute('data-i18n');
          if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll('[data-lang-link]').forEach(function(el) {
          var linkLang = el.getAttribute('data-lang-link');
          el.setAttribute('href', getLangUrl(linkLang));
          el.classList.toggle('is-active', linkLang === lang);
        });
      }
      apply(getLang());
    })();
  </script>
  <script>
    (function() {
      var nav = document.getElementById('nav');
      var toggle = document.getElementById('nav-toggle');
      var menu = document.getElementById('nav-menu');
      if (!toggle || !menu) return;
      function setOpen(open) {
        nav.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? (document.documentElement.lang === 'en' ? 'Close menu' : 'メニューを閉じる') : (document.documentElement.lang === 'en' ? 'Open menu' : 'メニューを開く'));
        document.body.style.overflow = open ? 'hidden' : '';
      }
      toggle.addEventListener('click', function() { setOpen(!nav.classList.contains('is-open')); });
      menu.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { setOpen(false); }); });
      window.addEventListener('resize', function() { if (window.innerWidth > 640) setOpen(false); });
    })();
  </script>
</body>
</html>
