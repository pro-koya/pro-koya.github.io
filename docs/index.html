<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="個人開発アプリのポートフォリオ。Liftly（筋トレ記録）、Block Zen（デイリーブロックパズル）を公開中。">
  <meta name="theme-color" content="#ffffff">
  <title>Apps by koya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #ffffff;
      --color-bg-card: #fafafa;
      --color-text: #0a0a0a;
      --color-text-muted: #525252;
      --color-border: rgba(0, 0, 0, 0.08);
      --color-accent: #0a0a0a;
      --font-sans: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text);
      line-height: 1.6; min-height: 100vh; overflow-x: hidden;
    }
    a { color: var(--color-text); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--color-text-muted); }
    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    /* Hero */
    .hero {
      padding: 6rem 0 3rem; text-align: center;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.125rem; color: var(--color-text-muted); max-width: 36ch;
      margin: 0 auto; line-height: 1.7;
    }

    /* App Cards */
    .apps { padding: 2rem 0 4rem; }
    .apps-grid { display: flex; flex-direction: column; gap: 24px; }
    .app-card {
      display: flex; gap: 24px; align-items: center; padding: 28px;
      background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: var(--radius); transition: all 0.3s; text-decoration: none;
    }
    .app-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); color: var(--color-text); }
    .app-icon {
      width: 72px; height: 72px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; font-weight: 700; color: #fff;
    }
    .app-icon--liftly { background: #0a0a0a; }
    .app-icon--blockzen { background: #6B8FAB; }
    .app-info { flex: 1; min-width: 0; }
    .app-info h2 { font-size: 1.375rem; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
    .app-info .app-tagline { font-size: 0.9375rem; color: var(--color-text-muted); margin: 0; line-height: 1.5; }
    .app-info .app-badges { display: flex; gap: 8px; margin-top: 0.75rem; flex-wrap: wrap; }
    .app-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 500;
      padding: 3px 10px; border-radius: 100px;
      background: rgba(0,0,0,0.05); color: var(--color-text-muted);
    }
    .app-arrow {
      flex-shrink: 0; color: var(--color-text-muted); font-size: 1.25rem;
      transition: transform 0.2s;
    }
    .app-card:hover .app-arrow { transform: translateX(4px); }

    /* Footer */
    .footer {
      padding: 32px 24px; border-top: 1px solid var(--color-border);
      text-align: center;
    }
    .footer-copy { color: var(--color-text-muted); font-size: 0.875rem; }

    /* Lang */
    .lang-switch {
      display: inline-flex; align-items: center; gap: 0; font-size: 0.875rem;
      background: #f5f5f5; border-radius: 100px; padding: 4px 4px 4px 10px;
      border: 1px solid var(--color-border); margin-top: 1.5rem;
    }
    .lang-link {
      color: var(--color-text-muted); padding: 6px 10px; border-radius: 100px;
      transition: color 0.2s, background 0.2s;
    }
    .lang-link:hover { color: var(--color-text); }
    .lang-link.is-active {
      color: #fff; background: var(--color-text); font-weight: 600; pointer-events: none;
    }
    .lang-sep { color: var(--color-border); margin: 0 2px; user-select: none; }

    @media (max-width: 640px) {
      .hero { padding: 4rem 0 2rem; }
      .app-card { flex-direction: column; align-items: flex-start; gap: 16px; padding: 20px; }
      .app-arrow { display: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="container">
      <h1 data-i18n="hero.title">Apps by koya</h1>
      <p data-i18n="hero.desc">個人開発で作ったアプリを公開しています。</p>
      <span class="lang-switch">
        <a href="?lang=ja" class="lang-link" data-lang-link="ja">日本語</a>
        <span class="lang-sep" aria-hidden="true">|</span>
        <a href="?lang=en" class="lang-link" data-lang-link="en">English</a>
      </span>
    </div>
  </section>

  <section class="apps">
    <div class="container">
      <div class="apps-grid">
        <a href="./liftly/" class="app-card" data-app-link="liftly">
          <div class="app-icon app-icon--liftly">L</div>
          <div class="app-info">
            <h2>Liftly</h2>
            <p class="app-tagline" data-i18n="liftly.tagline">シンプルで続く、筋トレ記録アプリ</p>
            <div class="app-badges">
              <span class="app-badge">iOS</span>
              <span class="app-badge" data-i18n="badge.free">無料</span>
            </div>
          </div>
          <span class="app-arrow" aria-hidden="true">&#8594;</span>
        </a>

        <a href="./blockzen/" class="app-card" data-app-link="blockzen">
          <div class="app-icon app-icon--blockzen">B</div>
          <div class="app-info">
            <h2>Block Zen</h2>
            <p class="app-tagline" data-i18n="blockzen.tagline">毎日届く、大人のブロックパズル</p>
            <div class="app-badges">
              <span class="app-badge">iOS</span>
              <span class="app-badge" data-i18n="badge.free">無料</span>
            </div>
          </div>
          <span class="app-arrow" aria-hidden="true">&#8594;</span>
        </a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span class="footer-copy" data-i18n="footer.copyright">© koya</span>
  </footer>

  <!-- Auth redirect (Liftly password reset fallback) -->
  <script>
    (function() {
      var q = window.location.search || '';
      var h = window.location.hash || '';
      var hasError = (q.indexOf('error=access_denied') >= 0 || q.indexOf('error_code=otp_expired') >= 0) ||
          (h.indexOf('error=access_denied') >= 0 || h.indexOf('error_code=otp_expired') >= 0);
      var hasCode = q.indexOf('code=') >= 0 || h.indexOf('code=') >= 0;
      if (hasError || hasCode) {
        window.location.replace('./auth/reset-complete.html' + q + h);
        return;
      }
    })();
  </script>

  <!-- i18n -->
  <script>
    (function() {
      var translations = {
        ja: {
          'hero.title': 'Apps by koya',
          'hero.desc': '個人開発で作ったアプリを公開しています。',
          'liftly.tagline': 'シンプルで続く、筋トレ記録アプリ',
          'blockzen.tagline': '毎日届く、大人のブロックパズル',
          'badge.free': '無料',
          'footer.copyright': '© koya'
        },
        en: {
          'hero.title': 'Apps by koya',
          'hero.desc': 'Apps I built as an indie developer.',
          'liftly.tagline': 'A simple workout log that sticks',
          'blockzen.tagline': 'A calm daily block puzzle for adults',
          'badge.free': 'Free',
          'footer.copyright': '© koya'
        }
      };
      var supportedLangs = ['ja', 'en'];
      var defaultLang = 'ja';

      function getLang() {
        var p = new URLSearchParams(window.location.search);
        var lang = (p.get('lang') || '').toLowerCase();
        return supportedLangs.indexOf(lang) >= 0 ? lang : defaultLang;
      }
      function getLangUrl(lang) {
        var u = new URL(window.location.href);
        u.searchParams.set('lang', lang);
        return u.pathname + u.search;
      }
      function apply(lang) {
        var t = translations[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
          var key = el.getAttribute('data-i18n');
          if (t[key]) el.textContent = t[key];
        });
        // Pass lang to sub-pages
        document.querySelectorAll('[data-app-link]').forEach(function(el) {
          var base = el.getAttribute('href').split('?')[0];
          el.setAttribute('href', base + '?lang=' + lang);
        });
        // Lang switcher
        document.querySelectorAll('[data-lang-link]').forEach(function(el) {
          var linkLang = el.getAttribute('data-lang-link');
          el.setAttribute('href', getLangUrl(linkLang));
          el.classList.toggle('is-active', linkLang === lang);
        });
        // Meta
        var titles = { ja: 'Apps by koya', en: 'Apps by koya' };
        var descs = { ja: '個人開発アプリのポートフォリオ。Liftly、Block Zenを公開中。', en: 'Indie app portfolio. Liftly and Block Zen available now.' };
        document.title = titles[lang];
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', descs[lang]);
      }
      apply(getLang());
    })();
  </script>
</body>
</html>
