<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="個人開発アプリのポートフォリオ。Liftly（筋トレ記録）、Calm Blokku（デイリーブロックパズル）を公開中。">
  <meta name="theme-color" content="#0a0a0a">
  <title>Apps by koya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-bg-light: #fafafa;
      --color-surface: #141414;
      --color-surface-hover: #1a1a1a;
      --color-text: #f5f5f5;
      --color-text-muted: #888;
      --color-text-dark: #0a0a0a;
      --color-text-dark-muted: #525252;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-border-light: rgba(0, 0, 0, 0.08);
      --color-liftly: #f5f5f5;
      --color-blockzen: #6B8FAB;
      --font-sans: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      --radius: 20px;
      --radius-sm: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text);
      line-height: 1.6; min-height: 100vh; overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* ─── Grain overlay ─── */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat; background-size: 256px 256px;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 0 24px; }

    /* ─── Scroll reveal ─── */
    .reveal {
      opacity: 0; transform: translateY(32px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }

    /* ─── Lang switch ─── */
    .lang-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: flex-end; padding: 16px 24px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
    }
    .lang-switch {
      display: inline-flex; align-items: center; font-size: 0.8125rem;
      background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 100px; padding: 3px 3px 3px 10px; border: 1px solid var(--color-border);
    }
    .lang-link {
      color: var(--color-text-muted); padding: 5px 10px; border-radius: 100px;
      transition: color 0.2s, background 0.2s;
    }
    .lang-link:hover { color: var(--color-text); }
    .lang-link.is-active { color: var(--color-bg); background: var(--color-text); font-weight: 600; pointer-events: none; }
    .lang-sep { color: rgba(255,255,255,0.15); margin: 0 2px; user-select: none; }

    /* ─── Hero (dark) ─── */
    .hero {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; position: relative; overflow: hidden;
      padding: 4rem 0;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(107, 143, 171, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-greeting {
      font-size: clamp(0.875rem, 1.5vw, 1rem); font-weight: 400;
      color: var(--color-text-muted); letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-size: clamp(3rem, 8vw, 5.5rem); font-weight: 800; letter-spacing: -0.04em;
      line-height: 1.05; margin-bottom: 1.5rem;
    }
    .hero h1 .gradient-text {
      background: linear-gradient(135deg, #f5f5f5 0%, #6B8FAB 50%, #f5f5f5 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 200% center; }
    }
    .hero-philosophy {
      font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 300;
      color: var(--color-text-muted); max-width: 44ch; margin: 0 auto 2.5rem;
      line-height: 1.8; letter-spacing: 0.01em;
    }
    .hero-stats {
      display: flex; gap: 48px; justify-content: center; margin-top: 3rem;
    }
    .stat { text-align: center; }
    .stat-num {
      font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.02em;
      color: var(--color-text);
    }
    .stat-label {
      font-size: 0.8125rem; color: var(--color-text-muted); margin-top: 0.25rem;
      letter-spacing: 0.03em;
    }
    .hero-scroll {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .hero-scroll-text { font-size: 0.75rem; color: var(--color-text-muted); letter-spacing: 0.1em; }
    .hero-scroll-line {
      width: 1px; height: 40px; background: linear-gradient(to bottom, var(--color-text-muted), transparent);
      animation: scroll-pulse 2s ease-in-out infinite;
    }
    @keyframes scroll-pulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.2); }
    }

    /* ─── Apps section (light) ─── */
    .apps-section {
      background: var(--color-bg-light); color: var(--color-text-dark);
      padding: 6rem 0; position: relative;
    }
    .apps-section::before {
      content: ""; position: absolute; top: -80px; left: 0; right: 0; height: 80px;
      background: linear-gradient(to bottom, var(--color-bg), var(--color-bg-light));
    }
    .section-label {
      font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--color-text-dark-muted); margin-bottom: 1rem;
    }
    .section-title {
      font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: -0.03em;
      margin-bottom: 3rem; line-height: 1.2;
    }

    /* App cards */
    .apps-grid { display: flex; flex-direction: column; gap: 20px; }
    .app-card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
      padding: 32px; background: #fff;
      border: 1px solid var(--color-border-light); border-radius: var(--radius);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none; color: var(--color-text-dark);
      position: relative; overflow: hidden;
    }
    .app-card::before {
      content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      border-radius: 4px 0 0 4px; transition: width 0.3s ease;
    }
    .app-card--liftly::before { background: var(--color-text-dark); }
    .app-card--blockzen::before { background: var(--color-blockzen); }
    .app-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .app-card:hover::before { width: 6px; }

    .app-icon {
      width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 800; color: #fff;
      position: relative; z-index: 1;
    }
    .app-icon--liftly { background: #0a0a0a; }
    .app-icon--blockzen {
      background: linear-gradient(135deg, #6B8FAB, #7BA99C);
    }

    .app-info { min-width: 0; }
    .app-name {
      font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .app-tagline {
      font-size: 0.9375rem; color: var(--color-text-dark-muted);
      margin: 0; line-height: 1.5;
    }
    .app-meta {
      display: flex; gap: 8px; margin-top: 0.75rem; align-items: center; flex-wrap: wrap;
    }
    .app-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em;
      padding: 4px 10px; border-radius: 100px; text-transform: uppercase;
    }
    .app-badge--platform { background: #f0f0f0; color: #666; }
    .app-badge--status { background: #e8f5e9; color: #2e7d32; }
    .app-badge--coming { background: #fff3e0; color: #e65100; }

    .app-arrow-wrap {
      width: 40px; height: 40px; border-radius: 50%;
      background: #f5f5f5; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s; flex-shrink: 0;
    }
    .app-card:hover .app-arrow-wrap { background: var(--color-text-dark); }
    .app-arrow {
      font-size: 1rem; color: #999; transition: all 0.3s;
    }
    .app-card:hover .app-arrow { color: #fff; transform: translateX(2px); }

    /* ─── Philosophy section ─── */
    .philosophy {
      padding: 6rem 0; text-align: center; position: relative;
    }
    .philosophy-text {
      font-size: clamp(1.125rem, 2.5vw, 1.5rem); font-weight: 300;
      color: var(--color-text-muted); max-width: 48ch; margin: 0 auto;
      line-height: 1.9; letter-spacing: 0.01em;
    }
    .philosophy-text em {
      font-style: normal; color: var(--color-text); font-weight: 500;
    }
    .philosophy-divider {
      width: 40px; height: 1px; background: rgba(255,255,255,0.15);
      margin: 2rem auto 0;
    }

    /* ─── Footer ─── */
    .footer {
      padding: 48px 24px 32px; text-align: center;
      border-top: 1px solid var(--color-border);
    }
    .footer-copy {
      color: var(--color-text-muted); font-size: 0.8125rem; letter-spacing: 0.05em;
    }

    /* ─── Mobile ─── */
    @media (max-width: 640px) {
      .hero { min-height: 90vh; padding: 3rem 0; }
      .hero-stats { gap: 32px; }
      .apps-section { padding: 4rem 0; }
      .app-card {
        grid-template-columns: auto 1fr; gap: 16px; padding: 20px;
      }
      .app-arrow-wrap { display: none; }
      .philosophy { padding: 4rem 0; }
      .hero-scroll { display: none; }
    }
    @media (max-width: 380px) {
      .hero h1 { font-size: 2.5rem; }
      .hero-stats { flex-direction: column; gap: 16px; }
      .app-icon { width: 52px; height: 52px; font-size: 1.25rem; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <!-- Lang -->
  <div class="lang-bar">
    <span class="lang-switch">
      <a href="?lang=ja" class="lang-link" data-lang-link="ja">日本語</a>
      <span class="lang-sep" aria-hidden="true">|</span>
      <a href="?lang=en" class="lang-link" data-lang-link="en">English</a>
    </span>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content container">
      <p class="hero-greeting reveal" data-i18n="hero.greeting">indie developer</p>
      <h1 class="reveal reveal-d1"><span class="gradient-text" data-i18n="hero.title">koya</span></h1>
      <p class="hero-philosophy reveal reveal-d2" data-i18n="hero.philosophy">
        使う人の時間を大切にする。<br>シンプルで、静かで、手触りのいいアプリを。
      </p>
      <div class="hero-stats reveal reveal-d3">
        <div class="stat">
          <div class="stat-num" data-i18n="stat.apps">2</div>
          <div class="stat-label" data-i18n="stat.apps.label">Apps</div>
        </div>
        <div class="stat">
          <div class="stat-num" data-i18n="stat.platform">iOS</div>
          <div class="stat-label" data-i18n="stat.platform.label">Platform</div>
        </div>
        <div class="stat">
          <div class="stat-num" data-i18n="stat.price">Free</div>
          <div class="stat-label" data-i18n="stat.price.label">Price</div>
        </div>
      </div>
    </div>
    <div class="hero-scroll" aria-hidden="true">
      <span class="hero-scroll-text">scroll</span>
      <span class="hero-scroll-line"></span>
    </div>
  </section>

  <!-- Apps -->
  <section class="apps-section">
    <div class="container">
      <p class="section-label reveal" data-i18n="apps.label">Works</p>
      <h2 class="section-title reveal reveal-d1" data-i18n="apps.title">つくったもの</h2>
      <div class="apps-grid">
        <a href="./liftly/" class="app-card app-card--liftly reveal reveal-d2" data-app-link="liftly">
          <div class="app-icon app-icon--liftly">L</div>
          <div class="app-info">
            <h3 class="app-name">Liftly</h3>
            <p class="app-tagline" data-i18n="liftly.tagline">シンプルで続く、筋トレ記録アプリ</p>
            <div class="app-meta">
              <span class="app-badge app-badge--platform">iOS</span>
              <span class="app-badge app-badge--status" data-i18n="badge.released">Released</span>
            </div>
          </div>
          <div class="app-arrow-wrap">
            <span class="app-arrow" aria-hidden="true">&#8594;</span>
          </div>
        </a>

        <a href="./blockzen/" class="app-card app-card--blockzen reveal reveal-d3" data-app-link="blockzen">
          <div class="app-icon app-icon--blockzen">B</div>
          <div class="app-info">
            <h3 class="app-name">Calm Blokku</h3>
            <p class="app-tagline" data-i18n="blockzen.tagline">毎日届く、大人のブロックパズル</p>
            <div class="app-meta">
              <span class="app-badge app-badge--platform">iOS</span>
              <span class="app-badge app-badge--coming" data-i18n="badge.coming">Coming Soon</span>
            </div>
          </div>
          <div class="app-arrow-wrap">
            <span class="app-arrow" aria-hidden="true">&#8594;</span>
          </div>
        </a>
      </div>
    </div>
  </section>

  <!-- Philosophy -->
  <section class="philosophy">
    <div class="container">
      <p class="philosophy-text reveal" data-i18n="philosophy.text">
        いいアプリは、<em>余計なものがない</em>こと。<br>
        使う人が迷わず、心地よく、<br>
        毎日そっと寄り添えるものを。
      </p>
      <div class="philosophy-divider reveal reveal-d1"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-copy" data-i18n="footer.copyright">© koya</span>
  </footer>

  <!-- Auth redirect (Liftly password reset fallback) -->
  <script>
    (function() {
      var q = window.location.search || '';
      var h = window.location.hash || '';
      var hasError = (q.indexOf('error=access_denied') >= 0 || q.indexOf('error_code=otp_expired') >= 0) ||
          (h.indexOf('error=access_denied') >= 0 || h.indexOf('error_code=otp_expired') >= 0);
      var hasCode = q.indexOf('code=') >= 0 || h.indexOf('code=') >= 0;
      if (hasError || hasCode) {
        window.location.replace('./auth/reset-complete.html' + q + h);
        return;
      }
    })();
  </script>

  <!-- Scroll reveal -->
  <script>
    (function() {
      var els = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        els.forEach(function(el) { el.classList.add('is-visible'); });
        return;
      }
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      els.forEach(function(el) { observer.observe(el); });
    })();
  </script>

  <!-- i18n -->
  <script>
    (function() {
      var translations = {
        ja: {
          'hero.greeting': 'indie developer',
          'hero.title': 'koya',
          'hero.philosophy': '使う人の時間を大切にする。\nシンプルで、静かで、手触りのいいアプリを。',
          'stat.apps': '2', 'stat.apps.label': 'Apps',
          'stat.platform': 'iOS', 'stat.platform.label': 'Platform',
          'stat.price': 'Free', 'stat.price.label': 'Price',
          'apps.label': 'Works',
          'apps.title': 'つくったもの',
          'liftly.tagline': 'シンプルで続く、筋トレ記録アプリ',
          'blockzen.tagline': '毎日届く、大人のブロックパズル',
          'badge.released': 'Released',
          'badge.coming': 'Coming Soon',
          'philosophy.text': 'いいアプリは、<em>余計なものがない</em>こと。\n使う人が迷わず、心地よく、\n毎日そっと寄り添えるものを。',
          'footer.copyright': '© koya'
        },
        en: {
          'hero.greeting': 'indie developer',
          'hero.title': 'koya',
          'hero.philosophy': 'Respecting the user\'s time.\nSimple, quiet, and well-crafted apps.',
          'stat.apps': '2', 'stat.apps.label': 'Apps',
          'stat.platform': 'iOS', 'stat.platform.label': 'Platform',
          'stat.price': 'Free', 'stat.price.label': 'Price',
          'apps.label': 'Works',
          'apps.title': 'What I\'ve built',
          'liftly.tagline': 'A simple workout log that sticks',
          'blockzen.tagline': 'A calm daily block puzzle for adults',
          'badge.released': 'Released',
          'badge.coming': 'Coming Soon',
          'philosophy.text': 'A good app is one with <em>nothing unnecessary</em>.\nIntuitive, comfortable,\nquietly there for you every day.',
          'footer.copyright': '© koya'
        }
      };
      var supportedLangs = ['ja', 'en'];
      var defaultLang = 'ja';

      function getLang() {
        var p = new URLSearchParams(window.location.search);
        var lang = (p.get('lang') || '').toLowerCase();
        return supportedLangs.indexOf(lang) >= 0 ? lang : defaultLang;
      }
      function getLangUrl(lang) {
        var u = new URL(window.location.href);
        u.searchParams.set('lang', lang);
        return u.pathname + u.search;
      }
      function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      function renderText(val) {
        // Preserve <em> tags, escape everything else, convert \n to <br>
        return val.replace(/\n/g, '<br>');
      }
      function apply(lang) {
        var t = translations[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
          var key = el.getAttribute('data-i18n');
          var val = t[key];
          if (val == null) return;
          if (val.indexOf('<em>') >= 0 || val.indexOf('\n') >= 0) {
            el.innerHTML = renderText(val);
          } else {
            el.textContent = val;
          }
        });
        document.querySelectorAll('[data-app-link]').forEach(function(el) {
          var base = el.getAttribute('href').split('?')[0];
          el.setAttribute('href', base + '?lang=' + lang);
        });
        document.querySelectorAll('[data-lang-link]').forEach(function(el) {
          var linkLang = el.getAttribute('data-lang-link');
          el.setAttribute('href', getLangUrl(linkLang));
          el.classList.toggle('is-active', linkLang === lang);
        });
        var descs = {
          ja: '個人開発アプリのポートフォリオ。Liftly、Calm Blokkuを公開中。',
          en: 'Indie app portfolio by koya. Liftly and Calm Blokku available now.'
        };
        document.title = 'koya — Apps';
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', descs[lang]);
      }
      apply(getLang());
    })();
  </script>
</body>
</html>
